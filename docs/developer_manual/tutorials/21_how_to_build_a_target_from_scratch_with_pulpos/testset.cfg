from gvtest.testsuite import Testset


def check_output(test, output: str):

    if output.find('Hello from my_target') == -1:
        return (False, "Didn't find output string\n")

    return (True, None)


def testset_build(testset: Testset):

    # GVSoC is compiled in the SDK build, shared with the other tests
    testset.new_make_test('21_how_to_build_a_target_from_scratch_with_pulpos',
        checker=check_output, build_resource='gvsoc.core.build', no_clean=True)
